# TLS-terminated deployment: nginx (443) -> backend (8000) -> postgres.
# Only nginx publishes ports; the API and the database stay on the private
# network and are never reachable directly.
#
#   cd deploy
#   ./make-certs.sh              # or drop real certs into ./certs
#   docker compose -f docker-compose.tls.yml up -d --build

services:
  postgres:
    image: postgres:16
    container_name: self-heal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: self_heal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]

  backend:
    build: ../backend
    container_name: self-heal-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/self_heal
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set a strong secret in .env}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://localhost}
      MAX_UPLOAD_MB: 2
      ENABLE_HSTS: "true"
      SELFHEAL_DIR: /app/selfheal
    depends_on: [postgres]
    networks: [internal]
    # no ports: the API is only reachable through nginx

  nginx:
    image: nginx:1.27-alpine
    container_name: self-heal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - certbot_www:/var/www/certbot
    depends_on: [backend]
    networks: [internal]

volumes:
  postgres_data:
  certbot_www:

networks:
  internal:
    driver: bridge
