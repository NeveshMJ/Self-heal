# ---------------------------------------------------------------------------
# Self-Healing Controller - TLS termination and edge hardening
#
# Nginx is the only thing exposed. It terminates TLS, serves the built React
# app, proxies /api to the FastAPI backend, caps request bodies at 2 MB, and
# sets the security headers on every response.
# ---------------------------------------------------------------------------

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;                 # do not advertise the nginx version

    # 2 MB cap on any request body: optional attachments, dataset CSVs and
    # knowledge-base article files. Anything larger is rejected at the edge
    # with 413 and never reaches the application.
    client_max_body_size 2m;
    client_body_buffer_size 256k;

    # basic abuse protection on the login endpoint
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ---------------- HTTP: redirect everything to HTTPS ----------------
    server {
        listen 80;
        server_name _;

        # Let's Encrypt HTTP-01 challenge, if you use certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------- HTTPS ----------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # OCSP stapling: enable with a real CA-issued certificate
        # (leave off for the self-signed development certificate)
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # ---------------- security headers ----------------
        # HSTS: browsers refuse plain HTTP for a year after the first visit
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # CSP for the React app. Everything is served from this origin, and
        # the API is same-origin under /api, so the policy can stay tight.
        # 'unsafe-inline' for styles only - Vite inlines the critical CSS.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

        # ---------------- API ----------------
        location /api/ {
            proxy_pass         http://backend:8000/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # the matcher can take a few seconds on a cold model load
            proxy_read_timeout 120s;
        }

        # rate-limited login
        location /api/auth/login {
            limit_req zone=login burst=5 nodelay;

            proxy_pass         http://backend:8000/auth/login;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------- React app ----------------
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;    # client-side routing
        }

        # oversized upload -> a JSON error the frontend can display
        error_page 413 = @too_large;
        location @too_large {
            default_type application/json;
            return 413 '{"detail":"Upload too large. The limit is 2 MB."}';
        }
    }
}
